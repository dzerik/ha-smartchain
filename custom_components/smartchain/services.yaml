ask:
  name: Ask SmartChain
  description: Send a message to SmartChain LLM and get a response.
  fields:
    message:
      name: Message
      description: The text message to send to the LLM
      required: true
      example: "What's the temperature in the kitchen?"
      selector:
        text:
    entity_id:
      name: Agent Entity
      description: The conversation agent entity to use (optional)
      required: false
      selector:
        entity:
          domain: conversation

analyze_image:
  name: Analyze Camera Image
  description: >
    Send a camera snapshot to SmartChain LLM for visual analysis.
    Fires smartchain_image_analyzed event and updates sensor.smartchain_last_analysis.
  fields:
    message:
      name: Message
      description: The question or instruction for the LLM about the image
      required: true
      selector:
        text:
    camera_entity_id:
      name: Camera Entity
      description: The camera entity to capture a snapshot from
      required: true
      selector:
        entity:
          domain: camera
    entity_id:
      name: Agent Entity
      description: The conversation agent entity to use (optional)
      required: false
      selector:
        entity:
          domain: conversation
    notify_entity:
      name: Notification Entity
      description: Send the LLM response as a notification (optional)
      required: false
      selector:
        entity:
          domain: notify

reload_tools:
  name: Reload Tools
  description: >
    Re-read /config/smartchain/tools.yaml. Restarts the MCP servers and rebuilds
    the memory subsystem. Fires smartchain_tools_reloaded.

clear_memory:
  name: Clear Memory
  description: >
    Delete stored long-term memories, optionally filtered by kind, agent and
    store. Fires smartchain_memory_cleared with the number deleted.
  fields:
    kind:
      name: Kind
      description: Which kind of memories to delete
      required: false
      default: any
      selector:
        select:
          options:
            - any
            - conversation
            - logbook
    agent_id:
      name: Agent ID
      description: Delete only memories written by this agent (optional)
      required: false
      example: conversation.smartchain
      selector:
        text:
    store:
      name: Memory Store
      description: >
        Name of the memory store to clear, as configured under memory.stores in
        tools.yaml. Omit to clear every configured store. Note: a store with a
        source: block is an entity index, and clearing one schedules a
        background sweep that rebuilds it from the live registries — the
        deletion is not permanent, and the rebuild re-embeds every entity.
      required: false
      example: conversations
      selector:
        text:

reindex_entities:
  name: Reindex entities
  description: >-
    Rebuild an entity index from the current registries. Only entities whose
    catalogue text changed are re-embedded, so this is cheap to call.
  fields:
    store:
      name: Store
      description: Which entity index to sweep. Omit to sweep all of them.
      required: false
      selector:
        text:
    full:
      name: Full
      description: >-
        Re-embed every entity even if nothing changed. Needed only after
        switching to a different embedding model.
      required: false
      default: false
      selector:
        boolean:
