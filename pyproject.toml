[project]
name = "ha-smartchain"
version = "5.6.6b4"
description = "SmartChain — multi-provider LLM conversation agent for Home Assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"custom_components/smartchain/const.py" = ["E501"]

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.15",
    "langchain-core>=0.3,<2",
    "langchain-gigachat>=0.3.0,<1",
    "langchain-openai>=0.3.0,<2",
    "langchain-community>=0.3.0,<0.5",
    "langchain-anthropic>=0.3.0,<2",
    "langchain-ollama>=0.3.0,<2",
    # >=0.2.3 is a reachability floor, not housekeeping: 0.2.3 is the release
    # that moved the SDK's default base URL to https://api.giga.chat/v1, which
    # is where Sber serves GigaChat-3-Ultra. See manifest.json.
    "gigachat>=0.2.3,<0.3",
    "PyTurboJPEG>=2.0",
    "hassil>=3.5.0",
    "home-assistant-intents>=2026.3.3",
    "jsonschema>=4.0",
    "mcp>=1.0,<2",
    # Imported at module level by websocket_api.py, so collecting the tests
    # needs them. manifest.json asks Home Assistant for them; this asks uv, and
    # test_declared_dependencies.py keeps the two lists from drifting apart.
    # The voluptuous pair carries no floor here: old pytest-homeassistant-
    # custom-component releases pin them exactly, and a floor makes the lock
    # unsolvable for the Python versions only those releases support.
    "probatio>=0.11.4",
    "voluptuous-openapi",
    "voluptuous-serialize",
    # Test-only: lets the cross-backend conformance suite actually exercise the
    # sqlite_vec backend in CI. Deliberately NOT in manifest.json — the runtime
    # requires no new dependency, and sqlite_vec stays lazy-imported.
    "sqlite-vec>=0.1",
]
