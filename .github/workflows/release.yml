name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required by sigstore/gh-action-sigstore-python for keyless OIDC signing.
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest.json version matches tag
        run: |
          MANIFEST_VERSION=$(jq -r .version custom_components/smartchain/manifest.json)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build HACS zip
        run: |
          cd custom_components/smartchain
          # `panel/__tests__` is the jsdom harness — it is never imported by
          # the panel's module graph, so it is inert in a Home Assistant
          # install, but there is no reason to ship it to one.
          zip -r "${GITHUB_WORKSPACE}/smartchain.zip" . \
            -x "*__pycache__*" "*.pyc" "*.pyo" "*__tests__*"

      # Keyless signing via Sigstore (OIDC, no secrets).
      # Produces smartchain.zip.sigstore alongside the zip, which any
      # downstream consumer can verify with `sigstore verify identity`.
      - name: Sign release artifact (sigstore)
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: smartchain.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            smartchain.zip
            smartchain.zip.sigstore
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') || contains(github.ref_name, 'b1') || contains(github.ref_name, 'b2') || contains(github.ref_name, 'b3') || contains(github.ref_name, 'a1') || contains(github.ref_name, 'a2') || contains(github.ref_name, 'rc') }}
