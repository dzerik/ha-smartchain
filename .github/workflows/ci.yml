name: CI

on:
  push:
    branches:
      - main
      - rc-*
  pull_request:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --prerelease=allow ruff check .
      - run: uv run --prerelease=allow ruff format --check .

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --prerelease=allow
      - run: uv run --prerelease=allow pytest tests/ -v

  panel:
    name: Run panel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # `npm ci` and not `npm install`: the lockfile is the whole point of
      # pinning a test runner for a project that ships no JavaScript
      # dependencies of its own.
      - run: npm ci
      - run: npm test
