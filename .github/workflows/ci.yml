name: CI

on:
  push:
    branches:
      - main
      - rc-*
  pull_request:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv run --prerelease=allow ruff check .
      - run: uv run --prerelease=allow ruff format --check .

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --prerelease=allow
      - run: uv run --prerelease=allow pytest tests/ -v
